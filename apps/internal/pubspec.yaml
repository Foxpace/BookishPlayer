name: bookish_internal
description: "Internal Bookish distribution with optional transcription."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bookish_cactus_transcription:
    path: ../../packages/bookish_cactus_transcription
  bookish_player:
    path: ../../packages/bookish_player
  flutter:
    sdk: flutter

# Cactus 1.3.0 uses APIs retained by these releases, but its old constraints
# conflict with file_picker 12 and share_plus 13 through win32.
dependency_overrides:
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
