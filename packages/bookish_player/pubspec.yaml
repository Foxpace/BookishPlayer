name: bookish_player
description: "A quiet, offline-first audiobook player."
publish_to: "none"
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  material_ui: ^1.4.0
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.11
  share_plus: ^13.3.0
  speech_to_text: ^7.5.0
  uuid: ^4.6.0

dev_dependencies:
  analyzer: ^13.3.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  intl_utils: ^2.8.16
  json_serializable: ^6.14.1
  pigeon: ^29.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/bookish_app_icon.png

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/core/localization/generated
