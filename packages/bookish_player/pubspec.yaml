name: bookish_player
description: "A quiet, offline-first audiobook player."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  injectable: ^3.0.0
  intl: ^0.20.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.9
  share_plus: ^12.0.2
  speech_to_text: ^7.4.0
  uuid: ^4.6.0

dev_dependencies:
  analyzer: ^10.2.0
  build_runner: ^2.15.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.0
  intl_utils: ^2.8.14
  json_serializable: ^6.14.1
  pigeon: ^27.3.0

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/core/localization/generated
